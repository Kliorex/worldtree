<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldTree · 空间知识</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;color:#ddd;background:#101010}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{background:#252525;border:1px solid #414141;color:#ddd;border-radius:7px;padding:9px 12px;cursor:pointer}button:hover{background:#373737;border-color:#888}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #eee;outline-offset:3px}button.primary{background:#eee;color:#171717}input,textarea,select{background:#191919;color:#ddd;border:1px solid #444;border-radius:6px;padding:10px;width:100%}textarea{resize:vertical;line-height:1.7}header{height:76px;border-bottom:1px solid #303030;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px}.brand{font-size:23px;letter-spacing:-1px;font-weight:600}.brand small{font-size:11px;letter-spacing:2px;display:block;color:#888;margin-top:5px}.top{display:flex;gap:8px;align-items:center}.save{font-size:12px;color:#999;margin-right:14px}main{display:grid;grid-template-columns:235px minmax(350px,1fr) 310px;height:calc(100vh - 76px)}aside{padding:24px 18px;background:#151515;overflow:auto}aside.left{border-right:1px solid #303030}aside.right{border-left:1px solid #303030}.eyebrow{font-size:11px;letter-spacing:2px;color:#888;margin-bottom:15px}h2{font-size:20px;font-weight:500;margin:6px 0 18px}h3{font-size:13px;color:#aaa;font-weight:500;margin:24px 0 10px}.muted{color:#888;font-size:12px;line-height:1.9}.list{display:flex;flex-direction:column;gap:6px}.list button{text-align:left;background:transparent;border-color:transparent;display:flex;justify-content:space-between;gap:8px}.list button.active{background:#292929;border-color:#444}.list button span{font-size:11px;color:#888}label{display:block;font-size:12px;color:#aaa;margin:18px 0 7px}.row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.row button{font-size:12px;flex:1}.stage{position:relative;overflow:hidden;background:#101010}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.breadcrumbs{position:absolute;top:25px;left:25px;display:flex;gap:8px;align-items:center}.breadcrumbs button{background:#171717d9;font-size:12px;padding:7px 10px}.tools{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#1a1a1ae8;border:1px solid #383838;border-radius:10px;padding:7px;white-space:nowrap}.tools button{font-size:12px}.stage-note{position:absolute;bottom:87px;left:0;right:0;text-align:center;font-size:11px;color:#777;pointer-events:none}.stats{position:absolute;top:28px;right:25px;font-size:11px;color:#777}.empty{padding-top:80px;text-align:center;color:#777}.directions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.directions button{font-size:12px}.rule{height:1px;background:#303030;margin:24px 0}.badge{font-size:11px;border:1px solid #444;padding:4px 8px;border-radius:20px;color:#aaa}.toast{position:fixed;bottom:24px;right:24px;background:#eee;color:#111;padding:12px 20px;border-radius:8px;z-index:9;font-size:13px;max-width:420px;display:none}.modal{position:fixed;inset:0;background:#000a;z-index:5;display:none;align-items:center;justify-content:center;padding:30px}.dialog{background:#1b1b1b;border:1px solid #444;border-radius:14px;padding:25px;width:min(860px,100%);max-height:90vh;overflow:auto}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.dialog-head h2{margin:0}.canvas-board{height:460px;position:relative;overflow:auto;background:#111;background-image:radial-gradient(#383838 1px,transparent 1px);background-size:22px 22px;border:1px solid #333;border-radius:9px;margin-top:18px}.block{position:absolute;width:220px;min-height:120px;background:#252525;border:1px solid #555;border-radius:8px;padding:13px;box-shadow:0 9px 30px #0004}.block .handle{font-size:10px;color:#999;cursor:move;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.block textarea{border:0;background:transparent;padding:0;min-height:80px}.block p{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.block button{padding:2px 5px;font-size:11px}.result{margin-top:7px;padding:9px;background:#222;border-radius:5px;font-size:12px}.result button{width:100%;text-align:left}.help p{font-size:13px;line-height:1.9;color:#bbb}.help li{font-size:13px;line-height:2} @media(max-width:1050px){main{grid-template-columns:180px minmax(300px,1fr) 270px}header{padding:0 16px}.save{display:none}}@media(max-width:760px){main{grid-template-columns:1fr;height:auto}.left{display:none}.stage{height:62vh}.right{min-height:300px}header{height:auto;min-height:76px;flex-wrap:wrap;padding:12px}.top button{font-size:11px;padding:6px}.tools{bottom:16px}.stats{display:none}}
</style></head><body>
<header><div class="brand">WorldTree<small>让知识拥有空间</small></div><div class="top"><span id="save" class="save">正在初始化本地存储</span><button id="undo">撤销</button><button id="redo">重做</button><button id="export">导出备份</button><button id="import">导入</button><button id="help">使用说明</button></div></header>
<main><aside class="left"><div class="eyebrow">你的知识世界</div><input id="search" placeholder="搜索知识、集合、虫洞" aria-label="全局搜索"><div id="results"></div><h3>当前空间</h3><div id="nodes" class="list"></div><h3>星环集合</h3><div id="orbits" class="list"></div><button id="newOrbit" style="width:100%;margin-top:8px">＋ 创建星环</button><div class="rule"></div><h3>虫洞 · 全局入口</h3><div id="worms" class="list"></div><p class="muted">虫洞是独立的信息容器。即使端点失效，内容仍可从这里访问。</p><div class="rule"></div><button id="trash" style="width:100%">回收站</button><p class="muted">本地优先 · 无需登录<br>知识只保存在此浏览器中<br>建议定期导出完整备份</p></aside>
<section class="stage"><canvas id="scene" aria-label="三维知识空间，节点操作也可通过左右侧栏完成"></canvas><div id="crumbs" class="breadcrumbs"></div><div id="stats" class="stats"></div><div class="stage-note">拖动空白旋转 · Shift + 拖动平移 · 滚轮缩放 · 拖动球体移动 · 双击进入内部空间</div><div class="tools"><button id="add" class="primary">＋ 球体</button><button id="link">连线</button><button id="worm">虫洞</button><button id="focus">聚焦</button><button id="reset">重置视角</button><button id="ortho">正交</button></div></section>
<aside class="right" id="inspector"></aside></main>
<div id="modal" class="modal"><div id="dialog" class="dialog"></div></div><div id="toast" class="toast" role="status"></div><input id="file" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID(), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), clone=x=>JSON.parse(JSON.stringify(x));
let db, state, selected=null, space='root', history=[], future=[], nav=[], camera={yaw:.35,pitch:-.18,zoom:1,panX:0,panY:0,ortho:false}, mode=null, selectedOrbit=null, projected=[], wormDots=[], W=1,H=1, saveQueue=Promise.resolve(), activeWorm=null;
const cameras={}, scene=$('scene'), ctx=scene.getContext('2d');
function seed(){const e={},i={};const names=['知识的生长','观察与记录','概念之间','未命名的想法','方法与实践'];const pts=[[0,0,0],[-230,-100,40],[230,-50,-50],[-130,170,-100],[230,170,70]];names.forEach((n,k)=>{e['e'+k]={id:'e'+k,title:n,body:['从一个想法开始。\n\n位置不定义层级，连接由你命名。双击球体，探索它的内部空间。','保留原始观察，再逐步建立自己的理解。','关系不是唯一的。\n连线表达联系，虫洞记录联系背后的信息。','一个尚未被定义的想法，也值得拥有位置。','把知识带回实践，再将新的经验放回空间。'][k],inner:null};i['i'+k]={id:'i'+k,entity:'e'+k,space:'root',pos:pts[k],note:''}});e.e0.inner='s1';e.e5={id:'e5',title:'新的枝叶',body:'这是球体内部的知识空间。使用面包屑返回外部。',inner:null};i.i5={id:'i5',entity:'e5',space:'s1',pos:[-120,0,0],note:''};i.i6={id:'i6',entity:'e1',space:'s1',pos:[140,40,20],note:'同一知识在这个空间的局部注释。'};return {version:1,entities:e,instances:i,spaces:{root:{id:'root',owner:null},s1:{id:'s1',owner:'e0'}},orbits:{o1:{id:'o1',space:'root',name:'探索中的线索',members:['i0','i1','i2'],angle:.15,scale:1}},links:{l1:{id:'l1',a:'e0',b:'e1',label:'观察',from:'i0',to:'i1'},l2:{id:'l2',a:'e0',b:'e2',label:'联系',from:'i0',to:'i2'}},worms:{w1:{id:'w1',title:'从观察到方法',a:'i1',b:'i4',blocks:[{id:'b1',type:'text',x:30,y:35,text:'我们怎样把观察转变成方法？\n\n在这里自由记录关系背后的信息。'},{id:'b2',type:'ref',x:320,y:130,entity:'e1'}]}},trash:[]}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',3500)}
function persist(){const snapshot=clone(state);$('save').textContent='保存中…';saveQueue=saveQueue.then(()=>new Promise((resolve,reject)=>{if(!db)return reject(new Error('本地数据库不可用'));const tx=db.transaction('world','readwrite');tx.objectStore('world').put(snapshot,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})).then(()=>$('save').textContent='已保存到此浏览器').catch(()=>{$('save').textContent='保存失败 · 请导出备份';toast('本地保存不可用，请导出备份，避免刷新丢失。')});return saveQueue}
function change(fn){const before=clone(state);try{fn();validate(state);history.push(before);if(history.length>60)history.shift();future=[];persist();renderUI()}catch(e){state=before;toast(e.message)}}
function validate(s){if(!s||s.version!==1)throw Error('不支持的备份版本');for(const k of ['entities','instances','spaces','orbits','links','worms'])if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))throw Error('缺少或损坏的数据表：'+k);if(!s.spaces.root||s.spaces.root.owner!==null||!Array.isArray(s.trash))throw Error('根空间或回收站无效');for(const [id,e] of Object.entries(s.entities)){if(e.id!==id||typeof e.title!=='string'||typeof e.body!=='string')throw Error('实体数据无效');if(e.inner&&(!s.spaces[e.inner]||s.spaces[e.inner].owner!==id))throw Error('内部空间归属无效')};for(const [id,p] of Object.entries(s.spaces)){if(p.id!==id||id!=='root'&&(!s.entities[p.owner]||s.entities[p.owner].inner!==id))throw Error('空间归属无效')};for(const [id,n] of Object.entries(s.instances)){if(n.id!==id||!s.entities[n.entity]||!s.spaces[n.space]||!Array.isArray(n.pos)||n.pos.length!==3||!n.pos.every(Number.isFinite)||typeof n.note!=='string')throw Error('Invalid instance data')};const graph={};for(const n of Object.values(s.instances)){const owner=s.spaces[n.space].owner;if(owner)(graph[owner]??=[]).push(n.entity)}const visiting=new Set(),done=new Set();function visit(id){if(visiting.has(id))throw Error('Recursive space ownership is forbidden');if(done.has(id))return;visiting.add(id);for(const child of graph[id]||[])visit(child);visiting.delete(id);done.add(id)}for(const id of Object.keys(s.entities))visit(id);for(const [id,o] of Object.entries(s.orbits)){if(o.id!==id||!s.spaces[o.space]||typeof o.name!=='string'||!Array.isArray(o.members)||!Number.isFinite(o.angle)||!Number.isFinite(o.scale)||o.scale<=0||o.members.some(x=>!s.instances[x]||s.instances[x].space!==o.space))throw Error('星环数据无效')};for(const [id,l] of Object.entries(s.links)){if(l.id!==id||!s.entities[l.a]||!s.entities[l.b]||typeof l.label!=='string')throw Error('连线数据无效');if(l.from&&s.instances[l.from]&&s.instances[l.from].entity!==l.a||l.to&&s.instances[l.to]&&s.instances[l.to].entity!==l.b)throw Error('连线端点不匹配')};for(const [id,w] of Object.entries(s.worms)){if(w.id!==id||typeof w.title!=='string'||!Array.isArray(w.blocks)||typeof w.a!=='string'||typeof w.b!=='string')throw Error('虫洞数据无效');for(const b of w.blocks)if(!['text','ref'].includes(b.type)||!Number.isFinite(b.x)||!Number.isFinite(b.y)||b.type==='text'&&typeof b.text!=='string'||b.type==='ref'&&typeof b.entity!=='string')throw Error('画布数据无效')}}
function current(){return Object.values(state.instances).filter(n=>n.space===space)}
function go(s,id=null){cameras[space]={...camera};nav.push({space,selected,camera:{...camera}});space=s;camera=cameras[s]||{yaw:.35,pitch:-.18,zoom:1,panX:0,panY:0,ortho:false};selected=id;selectedOrbit=null;mode=null;renderUI()}
function select(id){if(mode){if(id===mode.from){toast('请选择另一个球体');return}const first=state.instances[mode.from],second=state.instances[id];if(mode.kind==='link'){const name=prompt('为这条关系命名','关联');if(name!==null)change(()=>{const key=uid();state.links[key]={id:key,a:first.entity,b:second.entity,from:first.id,to:second.id,label:name}})}else{const name=prompt('虫洞名称','新的关系画布');if(name!==null)change(()=>{const key=uid();state.worms[key]={id:key,title:name,a:first.id,b:second.id,blocks:[]}})}mode=null}selected=id;selectedOrbit=null;renderUI()}
function addNode(pos=[(Math.random()-.5)*350,(Math.random()-.5)*250,0]){const title=prompt('球体名称','新的想法');if(title===null)return;let id;change(()=>{const e=uid();id=uid();state.entities[e]={id:e,title:title||'未命名',body:'',inner:null};state.instances[id]={id,entity:e,space,pos,note:''}});selected=id;renderUI()}
function enter(id){const n=state.instances[id],e=state.entities[n.entity];if(!e.inner){if(!confirm('为「'+e.title+'」创建内部空间？'))return;change(()=>{const s=uid();state.spaces[s]={id:s,owner:e.id};e.inner=s})}go(e.inner)}
function renderUI(){if(!state)return;const nodes=current();$('nodes').innerHTML=nodes.map(n=>`<button class="${selected===n.id?'active':''}" data-node="${n.id}">${esc(state.entities[n.entity].title)}<span>${state.entities[n.entity].inner?'内部空间':'球体'}</span></button>`).join('')||'<p class="muted">这个空间还没有球体。</p>';$('nodes').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>select(b.dataset.node));$('orbits').innerHTML=Object.values(state.orbits).filter(o=>o.space===space).map(o=>`<button data-orbit="${o.id}" class="${selectedOrbit===o.id?'active':''}">${esc(o.name)}<span>${o.members.length}</span></button>`).join('');$('orbits').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedOrbit=b.dataset.orbit;selected=null;renderUI()});$('worms').innerHTML=Object.values(state.worms).map(w=>`<button data-worm="${w.id}">${esc(w.title)}<span>${state.instances[w.a]&&state.instances[w.b]?'双环':'端点失效'}</span></button>`).join('');$('worms').querySelectorAll('button').forEach(b=>b.onclick=()=>openWorm(b.dataset.worm));$('crumbs').innerHTML=`<button id="home">世界</button>${space!=='root'?'<span class="muted">/</span><button>'+esc(state.entities[state.spaces[space].owner].title)+'</button><button id="back">← 返回</button>':''}`;$('home').onclick=()=>go('root');if($('back'))$('back').onclick=()=>{const p=nav.pop();if(p){cameras[space]={...camera};space=p.space;camera=p.camera;selected=p.selected;renderUI()}else go('root')};$('stats').textContent=nodes.length+' 个球体 / '+Object.keys(state.entities).length+' 项知识';$('undo').disabled=!history.length;$('redo').disabled=!future.length;$('ortho').textContent=camera.ortho?'透视':'正交';renderInspector();search()}
function renderInspector(){const p=$('inspector');if(selectedOrbit){const o=state.orbits[selectedOrbit];p.innerHTML=`<div class="eyebrow">星环 / 集合</div><h2>${esc(o.name)}</h2><p class="muted">成员由你选择。拖动球体不会改变归属，一个球体可以属于多个星环。</p><label>名称</label><input id="orbitName" value="${esc(o.name)}"><label>旋转</label><input id="angle" type="range" min="-3.14" max="3.14" step=".02" value="${o.angle}"><label>缩放</label><input id="scale" type="range" min=".3" max="2" step=".05" value="${o.scale}"><h3>成员</h3>${current().map(n=>`<label><input style="width:auto" type="checkbox" data-member="${n.id}" ${o.members.includes(n.id)?'checked':''}> ${esc(state.entities[n.entity].title)}</label>`).join('')}<div class="row"><button id="deleteOrbit">删除星环</button></div>`;$('orbitName').onchange=e=>change(()=>o.name=e.target.value);for(const k of ['angle','scale'])$(k).onchange=e=>change(()=>o[k]=Number(e.target.value));p.querySelectorAll('[data-member]').forEach(b=>b.onchange=()=>change(()=>o.members=b.checked?[...new Set([...o.members,b.dataset.member])]:o.members.filter(x=>x!==b.dataset.member)));$('deleteOrbit').onclick=()=>change(()=>{delete state.orbits[o.id];selectedOrbit=null});return}const n=state.instances[selected];if(!n){p.innerHTML='<div class="eyebrow">探索模式</div><h2>从一个想法开始。</h2><p class="muted">选择球体查看知识，或创建一个新的位置。<br><br>双击进入球体内部，让知识继续生长。</p><div class="rule"></div><h3>五种空间元素</h3><p class="muted">● 球体 · 知识与内容<br>◎ 星环 · 自定义集合<br>— 连线 · 轻量关系<br>◉ 球中球 · 内部空间<br>⊚ 虫洞 · 独立信息画布</p><div class="rule"></div><span class="badge">交互原型 v0.1</span>';return}const e=state.entities[n.entity];p.innerHTML=`<div class="eyebrow">知识 / 空间实例</div><label>名称</label><input id="title" value="${esc(e.title)}"><label>共享正文 · 纯文本</label><textarea id="body" rows="7">${esc(e.body)}</textarea><label>仅此实例的局部注释</label><textarea id="note" rows="2">${esc(n.note)}</textarea><p class="muted">${Object.values(state.instances).filter(x=>x.entity===e.id).length} 个实例共享正文 · 内容自动保存</p><div class="row"><button id="enter">${e.inner?'进入内部空间':'创建内部空间'}</button><button id="duplicate">引用已有知识</button></div><label>六方向生长</label><div class="directions">${['左','上','前','右','下','后'].map((d,k)=>`<button data-dir="${k}">${d}</button>`).join('')}</div><h3>关系</h3>${Object.values(state.links).filter(l=>l.a===e.id||l.b===e.id).map(l=>`<div class="result">${esc(l.label)} · ${esc(state.entities[l.a===e.id?l.b:l.a]?.title)}<div class="row"><button data-locate="${l.a===e.id?l.b:l.a}">定位</button><button data-del-link="${l.id}">删除连线</button></div></div>`).join('')||'<p class="muted">尚未建立连线</p>'}<div class="rule"></div><div class="row"><button id="remove">删除此实例</button></div>`;
for(const k of ['title','body','note'])$(k).onchange=ev=>{const value=ev.target.value;change(()=>k==='note'?n.note=value:e[k]=value)};$('enter').onclick=()=>enter(n.id);$('duplicate').onclick=()=>chooseEntity(entity=>{change(()=>{const id=uid();state.instances[id]={id,entity,space,pos:[n.pos[0]+130,n.pos[1]+90,n.pos[2]],note:''}})});p.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const d=[[-150,0,0],[0,-150,0],[0,0,150],[150,0,0],[0,150,0],[0,0,-150]][Number(b.dataset.dir)];addNode(n.pos.map((v,k)=>v+d[k]))});p.querySelectorAll('[data-del-link]').forEach(b=>b.onclick=()=>change(()=>delete state.links[b.dataset.delLink]));p.querySelectorAll('[data-locate]').forEach(b=>b.onclick=()=>locate(b.dataset.locate));$('remove').onclick=()=>{if(confirm('只删除此空间实例，共享正文保留。关联虫洞会标记端点失效。'))change(()=>{state.trash.push({type:'instance',value:clone(n)});delete state.instances[n.id];for(const o of Object.values(state.orbits))o.members=o.members.filter(x=>x!==n.id);selected=null})}}
function chooseEntity(fn){const all=Object.values(state.entities);show(`<div class="dialog-head"><h2>引用已有知识</h2><button id="close">关闭</button></div><p class="muted">共享正文，保留独立位置与局部注释。</p><div class="list">${all.map(e=>`<button data-entity="${e.id}">${esc(e.title)}</button>`).join('')}</div>`);$('dialog').querySelectorAll('[data-entity]').forEach(b=>b.onclick=()=>{hide();fn(b.dataset.entity)})}

function openWorm(id){activeWorm=id;const w=state.worms[id];show(`<div class="dialog-head"><h2>${esc(w.title)}</h2><button id="close">返回空间</button></div><p class="muted">独立信息画布 · 仅添加内容或引用，不能在这里创建球体。拖动卡片顶部调整布局。</p><div class="row"><button id="textBlock">＋ 文本</button><button id="refBlock">＋ 知识引用</button><button id="renameWorm">重命名</button><button id="deleteWorm">移入回收站</button></div><div id="board" class="canvas-board"></div><div class="row">${['a','b'].map(k=>`<button id="exit-${k}">${state.instances[w[k]]?'前往：'+esc(state.entities[state.instances[w[k]].entity].title):'端点失效 · 重新连接'}</button><button id="reconnect-${k}" aria-label="重新连接端点 ${k}">重连 ${k.toUpperCase()}</button>`).join('')}</div>`);activeWorm=id;renderBlocks();$('textBlock').onclick=()=>{change(()=>w.blocks.push({id:uid(),type:'text',text:'',x:30+(w.blocks.length%3)*35,y:30+(w.blocks.length%4)*45}));renderBlocks()};$('refBlock').onclick=()=>{chooseEntity(e=>{change(()=>w.blocks.push({id:uid(),type:'ref',entity:e,x:280,y:70}));openWorm(id)})};$('renameWorm').onclick=()=>{const title=prompt('虫洞名称',w.title);if(title!==null){change(()=>w.title=title);openWorm(id)}};$('deleteWorm').onclick=()=>{if(confirm('将虫洞及其画布移入回收站？')){change(()=>{state.trash.push({type:'worm',value:clone(w)});delete state.worms[id]});hide()}};for(const k of ['a','b']){$('exit-'+k).onclick=()=>{const n=state.instances[w[k]];if(n){hide();go(n.space,n.id);focusNode()}else reconnect(k)};$('reconnect-'+k).onclick=()=>reconnect(k)}function reconnect(k){show('<div class="dialog-head"><h2>选择新的端点实例</h2><button id="close">关闭</button></div><div class="list">'+Object.values(state.instances).map(n=>`<button data-end="${n.id}">${esc(state.entities[n.entity].title)} · ${esc(n.space==='root'?'世界':state.entities[state.spaces[n.space].owner].title)}</button>`).join('')+'</div>');$('dialog').querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{change(()=>w[k]=b.dataset.end);openWorm(id)})}}

function draw(){requestAnimationFrame(draw);if(!state)return;const rect=scene.getBoundingClientRect(),dpr=devicePixelRatio||1;if(W!==rect.width||H!==rect.height||scene.width!==Math.round(rect.width*dpr)){W=rect.width;H=rect.height;scene.width=Math.round(W*dpr);scene.height=Math.round(H*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.strokeStyle='#222';ctx.lineWidth=.6;for(let x=-700;x<=700;x+=100){line(project([x,300,-700]),project([x,300,700]));line(project([-700,300,x]),project([700,300,x]))}const ns=current();projected=ns.map(n=>({...project(n.pos),id:n.id})).sort((a,b)=>b.z-a.z);const byId=Object.fromEntries(projected.map(p=>[p.id,p]));for(const o of Object.values(state.orbits).filter(o=>o.space===space)){const members=o.members.map(id=>state.instances[id]);const center=members.length?[0,1,2].map(k=>members.reduce((v,n)=>v+n.pos[k],0)/members.length):[0,0,0];ctx.strokeStyle=selectedOrbit===o.id?'#ccc':'#555';ctx.lineWidth=1;ctx.beginPath();for(let t=0;t<=Math.PI*2+.05;t+=.04){const x=Math.cos(t)*260*o.scale,y=Math.sin(t)*170*o.scale,p=project([center[0]+x*Math.cos(o.angle)-y*Math.sin(o.angle),center[1]+x*Math.sin(o.angle)+y*Math.cos(o.angle),center[2]]);if(t===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke();const p=project([center[0],center[1]-180*o.scale,center[2]]);ctx.fillStyle='#888';ctx.font='11px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText(o.name,p.x,p.y)}for(const l of Object.values(state.links)){const a=byId[l.from],b=byId[l.to];if(!a||!b)continue;ctx.strokeStyle='#666';ctx.lineWidth=1;line(a,b);ctx.fillStyle='#888';ctx.font='10px "Microsoft YaHei"';ctx.fillText(l.label,(a.x+b.x)/2,(a.y+b.y)/2-8)}wormDots=[];for(const w of Object.values(state.worms)){for(const k of ['a','b']){const p=byId[w[k]];if(!p)continue;const d={x:p.x+p.r+18,y:p.y-22,id:w.id};wormDots.push(d);ctx.strokeStyle=state.instances[w.a]&&state.instances[w.b]?'#aaa':'#666';ctx.lineWidth=1;for(const r of [6,10]){ctx.beginPath();ctx.arc(d.x,d.y,r,0,Mat let drag=null;scene.onpointerdown=e=>{const r=scene.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,node=hit(x,y),wd=wormDots.find(d=>Math.hypot(d.x-x,d.y-y)<12);if(wd&&!node){openWorm(wd.id);return}drag={x:e.clientX,y:e.clientY,node:node?.id,moved:false,pos:node?state.instances[node.id].pos.slice():null,cam:{...camera},pan:e.shiftKey};scene.setPointerCapture(e.pointerId)};scene.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(drag.node&&!mode){const cy=Math.cos(camera.yaw),sy=Math.sin(camera.yaw),cp=Math.cos(camera.pitch);const scale=project(drag.pos).r/28;const a=dx/scale,b=dy/scale/Math.max(.3,cp);state.instances[drag.node].pos=[drag.pos[0]+a*cy,drag.pos[1]+b,drag.pos[2]-a*sy]}else if(drag.pan){camera.panX=drag.cam.panX+dx;camera.panY=drag.cam.panY+dy}else{camera.yaw=drag.cam.yaw+dx*.006;camera.pitch=Math.max(-1.2,Math.min(1.2,drag.cam.pitch+dy*.006))}};scene.onpointerup=e=>{if(!drag)return;const d=drag;drag=null;if(d.node){if(d.moved&&!mode){const after=state.instances[d.node].pos.slice();state.instances[d.node].pos=d.pos;change(()=>state.instances[d.node].pos=after)}else select(d.node)}};scene.ondblclick=e=>{const r=scene.getBoundingClientRect(),n=hit(e.clientX-r.left,e.clientY-r.top);if(n)enter(n.id)};scene.addEventListener('wheel',e=>{e.preventDefault();camera.zoom=Math.max(.25,Math.min(3,camera.zoom*Math.exp(-e.deltaY*.001)))},{passive:false});
